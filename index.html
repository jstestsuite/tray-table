<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tray Table Puzzles</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tray Table">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="theme-color" content="#E8EDF1">
<style>
/* Layout: one-column phone app; home = list of game tiles, game = header + board + tool dock. System fonts only so it works offline. */
:root{
  --bg:#E8EDF1; --surface:#F8FAFB; --ink:#17212B; --muted:#5A6977; --line:#C7D1DA;
  --accent:#0D6A72; --accent-ink:#FFFFFF; --sel:#CFE5E6; --hl:#DCE5EB; --bad:#B23E2C; --fill:#17212B;
  --p0:#D8574B; --p1:#EC9A3C; --p2:#E6CB45; --p3:#4FA65B; --p4:#3F7FD1; --p5:#8E5CC7; --p6:#E07BB0; --p7:#33AFAA;
  --display: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17212A; --ink:#E4ECF1; --muted:#8D9CA9; --line:#2B3946;
  --accent:#55B9BE; --accent-ink:#06191B; --sel:#1C3B3E; --hl:#1B2732; --bad:#EE8470; --fill:#D6E2EA;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17212A; --ink:#E4ECF1; --muted:#8D9CA9; --line:#2B3946;
  --accent:#55B9BE; --accent-ink:#06191B; --sel:#1C3B3E; --hl:#1B2732; --bad:#EE8470; --fill:#D6E2EA;
  color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:52px;padding-block:6px}
.bar h1{flex:1;margin:0;font:700 19px/1.2 var(--display);text-align:center;letter-spacing:-.005em}
.bar .side{display:flex;gap:6px;align-items:center;min-width:0}
.bar .side.r{justify-content:flex-end}
.bar .round{flex:none}
.link{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:600;font-size:16px}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-block:0 16px}

.btn{font:600 15px var(--body);padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}

/* Home */
.hero{display:grid;gap:8px;padding-block:14px 22px}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.hero h2{margin:0;font:800 40px/1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.hero p.lede{margin:0;color:var(--muted);font-size:16px;line-height:1.45;max-width:34ch}
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:14px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tile:active{transform:scale(.99)}
.tile h3{margin:0 0 3px;font:700 19px/1.2 var(--display)}
.tile p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tag{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--sel);color:var(--accent)}
.ico{width:64px;height:64px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.ico-ng{display:grid;grid-template-columns:repeat(5,8px);gap:2px}
.ico-ng i{width:8px;height:8px;border-radius:1.5px;background:var(--line)}
.ico-ng i.on{background:var(--fill)}
.ico-sd{display:grid;grid-template-columns:repeat(3,14px);font:700 12px/14px var(--display);text-align:center;color:var(--muted)}
.ico-sd span{border:1px solid var(--line);margin:-.5px}
.ico-sd span.a{color:var(--accent)}
.ico-cb{display:flex;gap:4px}
.ico-cb i{width:10px;height:10px;border-radius:50%}
.foot{color:var(--muted);font-size:13px;line-height:1.5;margin:22px 0 4px;text-align:center}

/* Shared game bits */
.under{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;color:var(--muted);font-size:13px}
.tools{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.seg{display:inline-flex;background:var(--hl);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

/* Nonogram */
.ng,.ng *{touch-action:none}
.ng{display:grid;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto}
.ng .cc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;padding-bottom:5px;font:600 var(--cf)/1 var(--mono);color:var(--ink)}
.ng .rc{display:flex;justify-content:flex-end;align-items:center;gap:.45em;padding-right:7px;font:600 var(--cf)/1 var(--mono);color:var(--ink)}
.ng .cc.ok,.ng .rc.ok{color:var(--muted);opacity:.45}
.ng .c{background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line);position:relative;transition:background .08s}
.ng .c.tr{box-shadow:inset 0 0 0 .5px var(--line),inset -2px 0 0 var(--muted)}
.ng .c.tb{box-shadow:inset 0 0 0 .5px var(--line),inset 0 -2px 0 var(--muted)}
.ng .c.tr.tb{box-shadow:inset 0 0 0 .5px var(--line),inset -2px 0 0 var(--muted),inset 0 -2px 0 var(--muted)}
.ng .c.f{background:var(--fill)}
.ng .c.x::after{content:"";position:absolute;inset:30%;background:
  linear-gradient(45deg,transparent 44%,var(--muted) 44%,var(--muted) 56%,transparent 56%),
  linear-gradient(-45deg,transparent 44%,var(--muted) 44%,var(--muted) 56%,transparent 56%)}
.ng.solved .c.x::after{display:none}
.ng.solved .c.f{background:var(--accent)}
.ng.solved .c{box-shadow:none}
.ng .corner{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 7px 5px 0}

/* Sudoku */
.sd{display:grid;margin:0 auto;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--surface);width:max-content}
.sd .s{display:grid;place-items:center;position:relative;font:600 var(--sf)/1 var(--display);color:var(--accent);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sd .s.br{border-right:2px solid var(--ink)}
.sd .s.bb{border-bottom:2px solid var(--ink)}
.sd .s.lc{border-right:0}
.sd .s.lr{border-bottom:0}
.sd .s.g{color:var(--ink);font-weight:700}
.sd .s.hl{background:var(--hl)}
.sd .s.same{background:var(--sel)}
.sd .s.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
.sd .s.bad{color:var(--bad)}
.sd.solved .s{color:var(--ink);background:var(--surface);box-shadow:none}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;justify-items:center;
  font:600 calc(var(--sf)*.4)/1 var(--body);color:var(--muted)}
.pad{display:grid;gap:5px;margin-top:10px}
.pad button{height:54px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 24px var(--display);color:var(--ink)}
.pad button.full{opacity:.3}
.pad button:active{background:var(--sel)}

/* Codebreaker */
.secret{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;border-radius:12px;background:var(--hl);margin-bottom:10px}
.secret .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.cb-rows{display:flex;flex-direction:column;gap:4px}
.cb-row{display:grid;grid-template-columns:22px minmax(0,1fr) 40px;align-items:center;gap:10px;padding:6px 10px;border-radius:12px}
.cb-row .n{font:600 13px var(--mono);color:var(--muted);text-align:right}
.cb-row.cur{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cb-row.future{opacity:.4}
.pegs{display:flex;gap:8px}
.peg{width:var(--pg);height:var(--pg);border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);border:0;padding:0;flex:none}
.peg.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.peg.hidden{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);font:700 15px var(--display)}
.fb{display:grid;gap:4px;justify-content:center}
.fb i{width:10px;height:10px;border-radius:50%;display:grid;place-items:center}
.fb i::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--line)}
.fb i.b{background:var(--ink)} .fb i.b::after{display:none}
.fb i.w{box-shadow:inset 0 0 0 2px var(--ink)} .fb i.w::after{display:none}
.dock{position:sticky;bottom:0;background:var(--bg);padding-block:10px 4px;margin-top:8px}
.palette{display:grid;gap:6px;justify-items:center}
.palette button{width:100%;max-width:48px;aspect-ratio:1;border-radius:50%;border:0;font:700 15px var(--mono)}
.palette button:active{transform:scale(.92)}
.dock .row{display:flex;gap:10px;margin-top:10px}
.dock .row .btn{flex:1}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin:2px 0 10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}

/* Sheet + toast */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,12,16,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;max-height:85%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:20px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:up .22s ease-out}
.sheet h2{margin:0 0 10px;font:700 22px/1.2 var(--display)}
.sheet p{margin:0 0 10px;font-size:15px;line-height:1.5}
.sheet .row{display:flex;gap:10px;margin-top:16px}
.sheet .row .btn{flex:1}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.opt b{font:700 16px var(--display)}
.opt span{font-size:13px;color:var(--muted)}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.4}
.toast p{margin:0;flex:1}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;padding:6px}
/* Letter Wheel */
.lw-board{display:grid;gap:3px;justify-content:center;margin:6px auto 4px}
.lw-board .lc{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font:800 var(--lc)/1 var(--display);color:var(--accent-ink)}
.lw-board .lc.on{background:var(--accent);border-color:var(--accent)}
.lw-board .lc.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:none}}
.lw-word{min-height:44px;display:flex;align-items:center;justify-content:center;font:700 18px var(--display);color:var(--muted);text-align:center}
.lw-word.typing{font:800 26px var(--display);letter-spacing:.12em;color:var(--ink)}
.lw-word.good{color:var(--accent);font-size:22px;letter-spacing:.08em}
.lw-word.bonus{color:var(--p5)}
.lw-word.bad{color:var(--bad)}
.lw-wheel{position:relative;margin:0 auto;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.lw-wheel svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lw-l{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);color:var(--ink);pointer-events:none;transition:background .1s,color .1s}
.lw-l.on{background:var(--accent);color:var(--accent-ink)}
.lw-shuffle{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:24px;color:var(--muted);z-index:2}
.lw-tools{margin-top:12px}
.ico-lw{position:relative;width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.ico-lw span{position:absolute;width:14px;height:14px;margin:-7px;font:800 11px/14px var(--display);text-align:center;color:var(--ink)}
.ico-lw span.on{color:var(--accent)}
/* Rebus */
.rb-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:220px;display:grid;place-items:center;padding:28px 16px;overflow:hidden}
.rb{font:800 34px/1.1 var(--display);color:var(--ink);text-align:center;letter-spacing:.03em;max-width:100%;overflow-wrap:anywhere}
.rb .st{display:flex;flex-direction:column;align-items:center;gap:8px}
.rb .st.tight{gap:0}
.rb .rw{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
.rb .ln{display:block;align-self:stretch;min-width:150px;height:3px;border-radius:2px;background:var(--ink)}
.rb .big{font-size:84px;line-height:1}
.rb .big2{font-size:56px;line-height:1}
.rb .sm{font-size:13px;font-weight:700}
.rb .vt{display:inline-flex;flex-direction:column;line-height:1.05}
.rb .rot{display:inline-block;transform:rotate(180deg)}
.rb .thin{font-weight:100}
.rb .wd{letter-spacing:.42em;margin-right:-.42em;font-size:24px;white-space:nowrap}
.rb .box{display:inline-block;border:3px solid var(--ink);padding:14px 18px;border-radius:3px}
.rb .ring{display:inline-block;border:3px solid var(--ink);border-radius:50%;padding:34px 20px;font-size:26px}
.rb .grow{display:inline-flex;align-items:baseline;gap:2px}
.rb .vio{color:var(--p5)}
.rb .grn{color:var(--p3)}
.rb .fade{opacity:.13}
.rb .strike{text-decoration:line-through;text-decoration-thickness:3px}
.rb .nu u{text-decoration:none}
.rb sup{font-size:.55em}
.rb .sea{letter-spacing:.1em;color:var(--p4)}
.rb .g2{display:grid;grid-template-columns:auto auto;gap:4px 18px}
.rb .xr{display:grid;grid-template-columns:repeat(5,1.05em);grid-template-rows:repeat(5,1.05em);place-items:center}
.rb .frame{width:180px;height:120px;border:3px solid var(--ink);border-radius:3px;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px 8px;font-size:22px}
.rb .fall{display:inline-flex;gap:4px;padding-bottom:66px}
.rb-pat{margin:14px 0 0;text-align:center;font:700 18px/1.4 var(--mono);color:var(--muted);white-space:pre-wrap;letter-spacing:.02em}
.rb-form{display:flex;gap:8px;margin-top:14px}
.rb-form input{flex:1;min-width:0;font:500 17px var(--body);padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.rb-form input:focus{outline:2px solid var(--accent);outline-offset:1px}
.rb-msg{min-height:22px;margin-top:8px;text-align:center;font-size:14px;color:var(--muted)}
.rb-msg.bad{color:var(--bad)}
.rb-res{display:grid;gap:4px;text-align:center;margin-top:16px;padding:14px;border-radius:14px;background:var(--hl)}
.rb-res b{font:800 22px var(--display)}
.rb-res span{color:var(--muted);font-size:14px}
.rb-res.good b{color:var(--accent)}
.rb-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0}
.rb-pick button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:600 15px var(--mono)}
.rb-pick button.ok{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.rb-pick button.sh{background:var(--hl);color:var(--muted)}
.rb-pick button.cur{box-shadow:0 0 0 2px var(--ink)}
.rb-key{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.rb-key span{display:inline-flex;gap:6px;align-items:center}
.rb-key i{width:12px;height:12px;border-radius:3px;background:var(--hl)}
.rb-key i.ok{background:var(--accent)}
.ico-rb{display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11px/1 var(--display);color:var(--ink)}
.ico-rb i{width:34px;height:2px;background:var(--ink)}
.credits{font-size:13px;line-height:1.5;color:var(--muted)}
.credits pre{white-space:pre-wrap;font:12px/1.45 var(--mono);background:var(--bg);padding:10px;border-radius:8px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.ng .c{transition:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{height:100%}body{margin:0;font-size:14px}</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="side"><button class="link" id="back" hidden>‹ Games</button></div>

</div>

<script>
(function(){
const $=(s,el=document)=>el.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem('tt:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('tt:'+k,JSON.stringify(v))}catch(e){}}
};
const stats=store.get('stats',{nonogram:0,sudoku:0,code:0,wheel:0,rebus:0});
const bump=k=>{stats[k]=(stats[k]||0)+1;store.set('stats',stats)};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

const view=$('#view'),titleEl=$('#title'),backBtn=$('#back'),helpBtn=$('#help'),newBtn=$('#newbtn');
let current=null;

/* ---------- sheets ---------- */
function sheet(html){const b=$('#sheetBody');b.innerHTML=html;$('#sheet').hidden=false;return b}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))closeSheet()});
function choose(title,opts,onPick){
  const b=sheet(`<h2>${title}</h2><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${o.label}</b><span>${o.sub}</span></button>`).join('')}</div><button class="btn wide" data-close>Cancel</button>`);
  b.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{closeSheet();onPick(opts[+el.dataset.i])});
}
function result(title,msg,again,label='Another'){
  const b=sheet(`<h2>${title}</h2><p>${msg}</p><div class="row"><button class="btn" id="rHome">All games</button><button class="btn" data-close>Look at it</button><button class="btn primary" id="rAgain">${label}</button></div>`);
  $('#rHome',b).onclick=()=>{closeSheet();go(null)};
  $('#rAgain',b).onclick=()=>{closeSheet();again()};
}

/* ---------- Nonogram ---------- */
function runs(line){const o=[];let k=0;for(const v of line){if(v===1)k++;else if(k){o.push(k);k=0}}if(k)o.push(k);return o.length?o:[0]}
function lineDeduce(L,clue,known){
  const k=(clue.length===1&&clue[0]===0)?[]:clue;
  const canF=new Array(L).fill(false),canE=new Array(L).fill(false),line=new Array(L).fill(0);let any=false;
  (function rec(b,start){
    if(b===k.length){
      for(let i=start;i<L;i++)if(known[i]===1)return;
      any=true;for(let i=0;i<L;i++){if(i<start&&line[i])canF[i]=true;else canE[i]=true}
      return;
    }
    let remain=0;for(let j=b;j<k.length;j++)remain+=k[j]+(j>b?1:0);
    for(let p=start;p+remain<=L;p++){
      if(p>start&&known[p-1]===1)break;
      let ok=true;for(let i=p;i<p+k[b];i++)if(known[i]===0){ok=false;break}
      const end=p+k[b];if(ok&&end<L&&known[end]===1)ok=false;
      if(ok){for(let i=start;i<p;i++)line[i]=0;for(let i=p;i<end;i++)line[i]=1;let nx=end;if(nx<L){line[nx]=0;nx++}rec(b+1,nx)}
    }
  })(0,0);
  if(!any)return null;
  return canF.map((f,i)=>f&&!canE[i]?1:(!f&&canE[i]?0:-1));
}
function ngSolvable(n,rows,cols){
  const k=new Array(n*n).fill(-1);let ch=true;
  while(ch){ch=false;
    for(let r=0;r<n;r++){const line=k.slice(r*n,r*n+n),res=lineDeduce(n,rows[r],line);if(!res)return false;
      for(let c=0;c<n;c++)if(line[c]===-1&&res[c]!==-1){k[r*n+c]=res[c];ch=true}}
    for(let c=0;c<n;c++){const line=[];for(let r=0;r<n;r++)line.push(k[r*n+c]);const res=lineDeduce(n,cols[c],line);if(!res)return false;
      for(let r=0;r<n;r++)if(line[r]===-1&&res[r]!==-1){k[r*n+c]=res[r];ch=true}}
  }
  return k.every(v=>v!==-1);
}
const Nonogram={
  key:'nonogram',name:'Nonogram',
  help:`<p>Fill squares to reveal a hidden pattern. The numbers beside each row and above each column list its runs of filled squares, in order. <b>3 1</b> means a run of three, at least one gap, then a single square.</p><p>Switch to <b>Mark empty</b> to put an × on squares you've ruled out. Drag across squares to fill a line quickly. Every puzzle can be solved by reasoning alone, with no guessing.</p><p>A clue fades once its line matches.</p>`,
  levels:[{n:5,label:'5 × 5',sub:'Warm-up · about 2 minutes'},{n:7,label:'7 × 7',sub:'Easy · about 5 minutes'},{n:10,label:'10 × 10',sub:'Standard · 10 to 15 minutes'}],
  chooser(){choose('New nonogram',this.levels,l=>{this.st=this.generate(l.n);this.save();go('nonogram')})},
  generate(n){
    let last=null;
    for(let t=0;t<400;t++){
      const sym=t<200,sol=new Array(n*n).fill(0);
      for(let r=0;r<n;r++)for(let c=0;c<n;c++){
        if(sym&&c>=Math.ceil(n/2))sol[r*n+c]=sol[r*n+(n-1-c)];else sol[r*n+c]=Math.random()<0.6?1:0;
      }
      const rows=[],cols=[];
      for(let r=0;r<n;r++)rows.push(runs(sol.slice(r*n,r*n+n)));
      for(let c=0;c<n;c++){const l=[];for(let r=0;r<n;r++)l.push(sol[r*n+c]);cols.push(runs(l))}
      last={n,rows,cols};
      if(ngSolvable(n,rows,cols))break;
    }
    return {...last,cells:new Array(n*n).fill(0),done:false};
  },
  save(){store.set('nonogram',this.st)},
  mount(el){
    if(!this.st)this.st=store.get('nonogram',null);
    if(!this.st){this.st=this.generate(7);this.save()}
    this.mode=this.mode||1;this.hist=[];
    const st=this.st;
    el.innerHTML=`<div class="under"><span>${st.n} × ${st.n}</span><span>Solved so far: ${stats.nonogram||0}</span></div>
      <div class="ng" id="ng"></div><div class="tools" id="ngTools"></div>`;
    this.build();this.toolbar();
  },
  toolbar(){
    const t=$('#ngTools');
    if(this.st.done){t.innerHTML=`<button class="btn primary" id="ngNew">New nonogram</button>`;$('#ngNew').onclick=()=>this.chooser();return}
    t.innerHTML=`<div class="seg" role="group" aria-label="What a tap does"><button id="mF" aria-pressed="${this.mode===1}">■ Fill</button><button id="mX" aria-pressed="${this.mode===2}">× Mark empty</button></div><button class="btn" id="ngUndo">Undo</button>`;
    $('#mF').onclick=()=>{this.mode=1;this.toolbar()};
    $('#mX').onclick=()=>{this.mode=2;this.toolbar()};
    $('#ngUndo').onclick=()=>this.undo();
  },
  build(){
    const st=this.st,n=st.n,g=$('#ng');
    const avail=Math.min(view.clientWidth,560);
    const slots=Math.max(...st.rows.map(r=>r.length));
    let cell=Math.floor((avail-8)/(n+slots*0.62));cell=Math.min(cell,n<=5?58:n<=7?48:40);
    const cf=Math.max(11,Math.min(17,Math.round(cell*0.44)));
    const clueW=Math.ceil(slots*cf*1.05+8);
    cell=Math.min(cell,Math.floor((avail-clueW-2)/n));
    g.style.setProperty('--cf',cf+'px');
    g.style.gridTemplateColumns=`${clueW}px repeat(${n},${cell}px)`;
    g.style.gridAutoRows=`${cell}px`;g.style.gridTemplateRows=`auto`;
    let h=`<div class="corner"></div>`;
    for(let c=0;c<n;c++)h+=`<div class="cc" id="cc${c}">${st.cols[c].map(v=>`<span>${v}</span>`).join('')}</div>`;
    for(let r=0;r<n;r++){
      h+=`<div class="rc" id="rc${r}">${st.rows[r].map(v=>`<span>${v}</span>`).join('')}</div>`;
      for(let c=0;c<n;c++)h+=`<div class="c" data-i="${r*n+c}"></div>`;
    }
    g.innerHTML=h;g.classList.toggle('solved',st.done);
    this.els=[...g.querySelectorAll('.c')];
    for(let i=0;i<n*n;i++)this.paint(i);
    for(let r=0;r<n;r++)this.clue('r',r);
    for(let c=0;c<n;c++)this.clue('c',c);
    g.ontouchstart=e=>{if(e.cancelable)e.preventDefault()};
    g.onpointerdown=e=>{
      const t=e.target.closest('.c');if(!t||st.done)return;e.preventDefault();
      const i=+t.dataset.i;this.hist.push(st.cells.slice());if(this.hist.length>80)this.hist.shift();
      this.target=st.cells[i]===this.mode?0:this.mode;
      this.drag={r:(i/n)|0,c:i%n,axis:null};this.apply(i);
    };
  },
  base(i){const n=this.st.n,r=(i/n)|0,c=i%n;let s='c';if(n>5&&c%5===4&&c<n-1)s+=' tr';if(n>5&&r%5===4&&r<n-1)s+=' tb';return s},
  paint(i){const v=this.st.cells[i];this.els[i].className=this.base(i)+(v===1?' f':v===2?' x':'')},
  clue(kind,k){
    const st=this.st,n=st.n,l=[];
    for(let j=0;j<n;j++)l.push(st.cells[kind==='r'?k*n+j:j*n+k]===1?1:0);
    const ok=runs(l).join()===(kind==='r'?st.rows[k]:st.cols[k]).join();
    $('#'+(kind==='r'?'rc':'cc')+k).classList.toggle('ok',ok);return ok;
  },
  apply(i){
    const st=this.st,cur=st.cells[i];
    if(this.target===0){if(cur!==this.mode)return;st.cells[i]=0}
    else{if(cur!==0)return;st.cells[i]=this.target}
    this.paint(i);this.clue('r',(i/st.n)|0);this.clue('c',i%st.n);
  },
  move(e){
    if(!this.drag)return;const el=document.elementFromPoint(e.clientX,e.clientY);
    const t=el&&el.closest&&el.closest('#ng .c');if(!t)return;
    const n=this.st.n,i=+t.dataset.i;let r=(i/n)|0,c=i%n;const d=this.drag;
    if(!d.axis&&(r!==d.r||c!==d.c))d.axis=Math.abs(r-d.r)>=Math.abs(c-d.c)?'col':'row';
    if(d.axis==='row')r=d.r;if(d.axis==='col')c=d.c;
    const a=Math.min(d.axis==='row'?c:r,d.axis==='row'?d.c:d.r),b=Math.max(d.axis==='row'?c:r,d.axis==='row'?d.c:d.r);
    for(let k=a;k<=b;k++)this.apply(d.axis==='row'?d.r*n+k:k*n+d.c);
  },
  end(){if(!this.drag)return;this.drag=null;this.save();this.check()},
  undo(){if(!this.hist.length)return;this.st.cells=this.hist.pop();this.save();this.build()},
  check(){
    const st=this.st,n=st.n;let all=true;
    for(let r=0;r<n;r++)all=this.clue('r',r)&&all;
    for(let c=0;c<n;c++)all=this.clue('c',c)&&all;
    if(!all)return;
    st.done=true;bump('nonogram');this.save();$('#ng').classList.add('solved');this.toolbar();
    setTimeout(()=>result('Pattern complete',`Every row and column checks out. That's ${stats.nonogram} solved on this device.`,()=>this.chooser()),700);
  }
};
window.addEventListener('pointermove',e=>{if(current==='nonogram')Nonogram.move(e)});
window.addEventListener('pointerup',()=>{if(current==='nonogram')Nonogram.end()});
window.addEventListener('pointercancel',()=>{if(current==='nonogram')Nonogram.end()});

document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ---------- Sudoku ---------- */
const geo=n=>n===6?{n:6,br:2,bc:3}:{n:9,br:3,bc:3};
function cands(g,i,G){
  const n=G.n,r=(i/n)|0,c=i%n,u=new Array(n+1).fill(false);
  for(let k=0;k<n;k++){u[g[r*n+k]]=true;u[g[k*n+c]]=true}
  const r0=r-r%G.br,c0=c-c%G.bc;
  for(let a=0;a<G.br;a++)for(let b=0;b<G.bc;b++)u[g[(r0+a)*n+c0+b]]=true;
  const o=[];for(let v=1;v<=n;v++)if(!u[v])o.push(v);return o;
}
function pick(g,G){let best=-1,bc=null;for(let i=0;i<g.length;i++)if(!g[i]){const c=cands(g,i,G);if(!c.length)return{dead:true};if(!bc||c.length<bc.length){best=i;bc=c;if(c.length===1)break}}return{best,bc}}
function sdFill(g,G){const{dead,best,bc}=pick(g,G);if(dead)return false;if(best<0)return true;for(const v of shuffle(bc)){g[best]=v;if(sdFill(g,G))return true}g[best]=0;return false}
function sdCount(g,G,lim){const{dead,best,bc}=pick(g,G);if(dead)return 0;if(best<0)return 1;let t=0;for(const v of bc){g[best]=v;t+=sdCount(g,G,lim);if(t>=lim)break}g[best]=0;return t}
function peers(i,G){
  const n=G.n,r=(i/n)|0,c=i%n,s=new Set();
  for(let k=0;k<n;k++){s.add(r*n+k);s.add(k*n+c)}
  const r0=r-r%G.br,c0=c-c%G.bc;for(let a=0;a<G.br;a++)for(let b=0;b<G.bc;b++)s.add((r0+a)*n+c0+b);
  s.delete(i);return[...s];
}
const Sudoku={
  key:'sudoku',name:'Sudoku',
  help:`<p>Fill the grid so every row, every column and every outlined box holds each number exactly once.</p><p>Tap a square, then a number. Turn on <b>Notes</b> to pencil in possibilities. A number that clashes with another in its row, column or box turns red.</p><p>Each puzzle has exactly one solution.</p>`,
  levels:[
    {n:6,d:'easy',label:'6 × 6 · Gentle',sub:'Numbers 1 to 6 · about 5 minutes'},
    {n:6,d:'hard',label:'6 × 6 · Tricky',sub:'Fewer starting numbers'},
    {n:9,d:'easy',label:'9 × 9 · Easy',sub:'Classic size · 10 to 15 minutes'},
    {n:9,d:'med',label:'9 × 9 · Medium',sub:'15 to 25 minutes'},
    {n:9,d:'hard',label:'9 × 9 · Hard',sub:'As few starting numbers as possible'}],
  chooser(){choose('New sudoku',this.levels,l=>{this.st=this.generate(l.n,l.d,l.label);this.save();go('sudoku')})},
  generate(n,d,label){
    const G=geo(n),g=new Array(n*n).fill(0);sdFill(g,G);const sol=g.slice();
    const target={6:{easy:20,hard:12},9:{easy:38,med:30,hard:0}}[n][d];
    let clues=n*n;
    for(const i of shuffle([...Array(n*n).keys()])){
      if(clues<=target)break;const s=g[i];g[i]=0;
      if(sdCount(g.slice(),G,2)!==1)g[i]=s;else clues--;
    }
    return{n,label,sol,given:g.map(v=>v>0),vals:g.slice(),notes:new Array(n*n).fill(0),sel:-1,done:false};
  },
  save(){store.set('sudoku',this.st)},
  mount(el){
    if(!this.st)this.st=store.get('sudoku',null);
    if(!this.st){this.st=this.generate(6,'easy','6 × 6 · Gentle');this.save()}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const LW_DATA=window.TT_WORDS;
const LW={};for(const t of ['C','A','B']){LW[t]={};for(const k in LW_DATA[t])LW[t][k]=LW_DATA[t][k].split(' ')}
const lwAll=new Set();for(const t in LW)for(const k in LW[t])LW[t][k].forEach(w=>lwAll.add(w));
const lwCommon=new Set();for(const t of ['C','A'])for(const k in LW[t])LW[t][k].forEach(w=>lwCommon.add(w));
function lwCounts(w){const c=new Array(26).fill(0);for(const ch of w)c[ch.charCodeAt(0)-97]++;return c}

function lwPlace(cands,max,rng,MW,MH){

  for(const w of cands.slice(1)){
    if(placed.length>=max)break;
    let best=null;
    for(const p of placed){const d=p.d?0:1;
      for(let j=0;j<p.w.length;j++)for(let i=0;i<w.length;i++){if(w[i]!==p.w[j])continue;
        const pr=p.r+(p.d?j:0),pc=p.c+(p.d?0:j);const r=pr-(d?i:0),c=pc-(d?0:i);
        let ok=true,cross=0;

        if(!empty(br,bcc)||!empty(ar,ac))continue;
        for(let k=0;k<w.length&&ok;k++){const rr=r+(d?k:0),cc=c+(d?0:k),e=cells.get(key(rr,cc));
          if(e){if(e.ch!==w[k]||(e.dirs&(d?2:1)))ok=false;else cross++}
          else{if(d){if(!empty(rr,cc-1)||!empty(rr,cc+1))ok=false}else{if(!empty(rr-1,cc)||!empty(rr+1,cc))ok=false}}}
        if(!ok||cross===w.length)continue;

function lwGen(n){
  const rng=mulberry32(n*7919+13),sp=lwSpec(n),bases=LW.C[sp.len];

  for(let t=0;t<300;t++){

    const sc=lwSubs('C',bc,sp.len).filter(w=>w!==base),sa=lwSubs('A',bc,sp.len);
    if(sc.length+1<sp.min)continue;
    const order=a=>a.map(w=>[w,w.length+rng()*1.6]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
    const cands=[base,...order(sc),...order(sa)];
    const lay=lwPlace(cands,sp.max,rng,sp.len<=5?8:10,sp.len<=5?7:9);
    const res={n,base,...lay};
    if(lay.words.length>=Math.min(sp.max,sp.min+1))return res;
    if(lay.words.length>=sp.min&&!fallback)fallback=res;
  }
  return fallback;
}

  local(e){const r=$('#lwWheel').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}},
  hit(e,f){const p=this.local(e);let best=-1,bd=1e9;this.pos.forEach((q,i)=>{const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<this.s*f&&d<bd){bd=d;best=i}});return best},
  draw(){
    const ls=[...$('#lwWheel').querySelectorAll('.lw-l')];ls.forEach((d,i)=>d.classList.toggle('on',this.sel.includes(i)));
    const pts=this.sel.map(i=>this.pos[i]);if(this.dragging&&this.pt)pts.push(this.pt);
    $('#lwLines').innerHTML=pts.length>1?`<polyline points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="${Math.max(6,this.s*0.16)}" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`:'';
    if(this.sel.length){const el=$('#lwWord');el.className='lw-word typing';el.textContent=this.sel.map(i=>this.st.letters[i].toUpperCase()).join('');clearTimeout(this.mt)}
    else if(!this.mt)$('#lwWord').textContent='';
  },
  msg(t,cls){const el=$('#lwWord');el.className='lw-word '+(cls||'');el.textContent=t;clearTimeout(this.mt);this.mt=setTimeout(()=>{this.mt=null;if(!this.sel.length){el.textContent='';el.className='lw-word'}},1300)},
  shuffle(){const st=this.st;if(this.dragging)return;let n;do{n=shuffle(st.letters.slice())}while(n.join('')===st.letters.join('')&&new Set(n).size>1);st.letters=n;this.save();this.renderLetters()},
  submit(){
    const st=this.st,word=this.sel.map(i=>st.letters[i]).join('');this.sel=[];this.mt=null;this.draw();
    if(word.length<3){if(word.length>1)this.msg('Words need 3 letters or more','muted');return}
    const gw=st.L.words.find(x=>x.w===word);
    if(gw){if(st.found.includes(word))this.msg('Already found','muted');
      else{const ks=this.cellsOf(gw);ks.forEach(k=>{if(!st.rev.includes(k))st.rev.push(k)});st.found.push(word);this.msg(word.toUpperCase(),'good');this.renderBoard();
        ks.forEach(k=>{const e=document.querySelector(`#lwBoard [data-k="${k}"]`);if(e)e.classList.add('pop')})}}
    else if(lwAll.has(word)){if(st.bonus.includes(word))this.msg('Already a bonus word','muted');else{st.bonus.push(word);$('#lwBn').textContent=st.bonus.length;this.msg('Bonus word: '+word.toUpperCase(),'bonus')}}
    else this.msg(word.toUpperCase()+' isn\'t in the word list','bad');
    this.check();this.save();
  },
  hint(){
    const st=this.st;if(st.done)return;const rev=new Set(st.rev);
    const open=st.L.words.filter(w=>!st.found.includes(w.w));if(!open.length)return;
    open.sort((a,b)=>a.w.length-b.w.length);const w=open[rnd(Math.min(2,open.length))];
    const k=this.cellsOf(w).find(k=>!rev.has(k));if(!k)return;st.rev.push(k);this.renderBoard();
    const e=document.querySelector(`#lwBoard [data-k="${k}"]`);if(e)e.classList.add('pop');this.check();this.save();
  },
  check(){
    const st=this.st,rev=new Set(st.rev);
    for(const w of st.L.words)if(!st.found.includes(w.w)&&this.cellsOf(w).every(k=>rev.has(k)))st.found.push(w.w);
    if(!st.done&&st.found.length>=st.L.words.length){
      st.done=true;bump('wheel');this.save();
      const b=st.bonus.length;
      setTimeout(()=>result(`Level ${st.n} complete`,`You filled all ${st.L.words.length} words${b?`, plus ${b} bonus word${b>1?'s':''}`:''}.`,()=>{this.st=this.newState(st.n+1);this.save();go('wheel')},'Next level'),650);
    }
  },
  key(e){
    const st=this.st;if(!st||st.done||e.metaKey||e.ctrlKey)return;
    if(/^[a-zA-Z]$/.test(e.key)){const ch=e.key.toLowerCase();const i=st.letters.findIndex((c,j)=>c===ch&&!this.sel.includes(j));if(i>=0){this.sel.push(i);this.draw()}}
    else if(e.key==='Backspace'){this.sel.pop();this.mt=null;this.draw()}
    else if(e.key==='Enter')this.submit();
  }
};

function rbNorm(s){return s.toLowerCase().replace(/&/g,' and ').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function rbForms(s){const n=rbNorm(s);return[n.replace(/ /g,''),n.split(' ').filter(w=>!['a','an','the'].includes(w)).join('')]}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const Rebus={
  key:'rebus',name:'Rebus',newLabel:'Puzzles',
  help:`<p>Each card is a word picture. The words, and where and how they're written, spell out a common phrase. <b>SAND</b> drawn inside a box, for example, reads "sandbox."</p><p>Type your answer and press Check. Spelling counts, but capitals, punctuation and small words like "the" don't.</p><p>Stuck? <b>Hint</b> first shows how many letters are in each word, then the first letter of each word, and finally the answer. You can also skip a puzzle and come back to it.</p>`,
  load(){if(!this.st)this.st=store.get('rebus',null);if(!this.st)this.st={i:0,solved:[],shown:[],hints:{}};return this.st},
  save(){store.set('rebus',this.st)},
  chooser(){
    const st=this.load();
    const b=sheet(`<h2>Puzzles</h2><p>${st.solved.length} of ${REBUS.length} solved. Tap any number to jump to it.</p><div class="rb-pick">${REBUS.map((_,i)=>`<button data-i="${i}" class="${st.solved.includes(i)?'ok':st.shown.includes(i)?'sh':''}${i===st.i?' cur':''}">${i+1}</button>`).join('')}</div><div class="rb-key"><span><i class="ok"></i>Solved</span><span><i class="sh"></i>Answer shown</span></div><div class="row"><button class="btn" data-close>Close</button></div>`);
    b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{closeSheet();st.i=+x.dataset.i;this.save();go('rebus')});
  },
  mount(el){
    const st=this.load(),i=st.i,p=REBUS[i],done=st.solved.includes(i),shown=st.shown.includes(i),hl=st.hints[i]||0;
    const ans=p.a[0];
    const pat=ans.split(' ').map(w=>[...w].map((c,k)=>hl>=2&&k===0?c.toUpperCase():'_').join(' ')).join('   ');
    el.innerHTML=`<div class="under"><span>Puzzle ${i+1} of ${REBUS.length}</span><span>Solved: ${st.solved.length}</span></div>
      <div class="rb-card" aria-label="Rebus picture"><div class="rb">${p.h}</div></div>
      ${done||shown?`<div class="rb-res ${done?'good':''}"><b>${ans[0].toUpperCase()+ans.slice(1)}</b><span>${p.why}</span></div>
        <div class="tools"><button class="btn" id="rbPrev" ${i===0?'disabled':''}>Previous</button><button class="btn primary" id="rbNext">Next puzzle</button></div>`
      :`<div class="rb-pat" ${hl?'':'hidden'}>${pat}</div>
        <form class="rb-form" id="rbForm"><input id="rbIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Type the phrase" aria-label="Your answer"><button class="btn primary">Check</button></form>
        <div class="rb-msg" id="rbMsg" aria-live="polite"></div>
        <div class="tools"><button class="btn" id="rbPrev" ${i===0?'disabled':''}>Previous</button><button class="btn" id="rbHint">${hl>=2?'Show answer':'Hint'}</button><button class="btn" id="rbSkip">Skip</button></div>`}`;
    const prev=$('#rbPrev');if(prev)prev.onclick=()=>{st.i=Math.max(0,i-1);this.save();this.mount(el)};
    const nx=$('#rbNext');if(nx)nx.onclick=()=>this.next();
    const sk=$('#rbSkip');if(sk)sk.onclick=()=>this.next();
    const hb=$('#rbHint');if(hb)hb.onclick=()=>{if(hl>=2){st.shown.push(i)}else st.hints[i]=hl+1;this.save();this.mount(el)};
    const f=$('#rbForm');if(f)f.onsubmit=e=>{e.preventDefault();this.check($('#rbIn').value)};
  },
  next(){
    const st=this.st,N=REBUS.length;
    if(st.solved.length+st.shown.length>=N&&st.solved.length===N){result('Pack complete',`You've solved all ${N} puzzles.`,()=>{},'Nice');return}
    let j=st.i;for(let k=1;k<=N;k++){const c=(st.i+k)%N;if(!st.solved.includes(c)&&!st.shown.includes(c)){j=c;break}}
    if(j===st.i)j=(st.i+1)%N;
    st.i=j;this.save();go('rebus');
  },
  check(v){
    const st=this.st,i=st.i,p=REBUS[i],m=$('#rbMsg');
    if(!v.trim()){m.textContent='Type a phrase first.';m.className='rb-msg';return}
    const g=rbForms(v),okF=p.a.flatMap(rbForms);
    if(g.some(x=>okF.includes(x))){st.solved.push(i);bump('rebus');this.save();this.mount(view);
      if(st.solved.length===REBUS.length)setTimeout(()=>result('Pack complete',`You've solved all ${REBUS.length} puzzles.`,()=>{},'Nice'),400);return}
    const close=okF.some(x=>lev(g[0],x)<=Math.max(1,Math.floor(x.length/8)));
    m.textContent=close?'Very close. Check the spelling.':'Not quite. Look at where each word sits.';m.className='rb-msg bad';
  }
};

const GAMES={wheel:LetterWheel,rebus:Rebus,nonogram:Nonogram,sudoku:Sudoku,code:Codebreaker};
function status(key){
  const s=store.get(key,null);
  if(key==='wheel')return s?`<span class="chip">Level ${s.done?s.n+1:s.n}</span>`:'';
  if(key==='rebus')return s&&s.solved.length?`<span class="chip">${s.solved.length} of ${REBUS.length} solved</span>`:'';
  if(!s||s.done)return '';
  const started=key==='nonogram'?s.cells.some(v=>v):key==='sudoku'?s.vals.some((v,i)=>v&&!s.given[i]):s.guesses.length>0||s.cur.some(v=>v>=0);
  return started?'<span class="chip">In progress</span>':'';
}
